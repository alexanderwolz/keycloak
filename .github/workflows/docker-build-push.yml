name: Build and Push Docker Image

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        otel: [false, true]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version from Dockerfile
        id: dockerfile-version
        run: |
          VERSION=$(grep -m1 '^ARG KEYCLOAK_VERSION=' build/Dockerfile | sed -E 's/ARG KEYCLOAK_VERSION="?([^"]*)"?/\1/')
          if [ -z "$VERSION" ]; then
            echo "[ERROR] Could not determine KEYCLOAK_VERSION from build/Dockerfile"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches Dockerfile version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          DOCKERFILE_VERSION="${{ steps.dockerfile-version.outputs.version }}"
          if [ "$TAG_VERSION" != "$DOCKERFILE_VERSION" ]; then
            echo "[ERROR] Git tag ($GITHUB_REF_NAME) does not match ARG KEYCLOAK_VERSION in build/Dockerfile ($DOCKERFILE_VERSION)"
            exit 1
          fi

      - name: Determine image tag
        id: image-tag
        run: |
          TAG="${{ steps.dockerfile-version.outputs.version }}"
          if [ "${{ matrix.otel }}" = "true" ]; then
            TAG="${TAG}-otel"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: alexanderwolz
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: build
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            ENABLE_OTEL=${{ matrix.otel }}
          tags: alexanderwolz/keycloak:${{ steps.image-tag.outputs.tag }}
          cache-from: type=gha,scope=keycloak-otel-${{ matrix.otel }}
          cache-to: type=gha,mode=max,scope=keycloak-otel-${{ matrix.otel }}
